<!doctype html>
<html><head><meta charset="utf-8"><title>Event art</title>
<link rel="stylesheet" href="assets/index-DrlYtYL8.css">
<style>body{background:#2b2f2a;color:#eee;font:13px sans-serif;margin:12px}.grid{display:flex;flex-wrap:wrap;gap:10px}.cell{background:#3d4a39;border-radius:6px;padding:6px;text-align:center}.cell svg{width:220px;height:200px;display:block}</style>
</head><body><div class="grid" id="grid"></div>
<script type="module">
window.__ready = (async () => {
  await import('./assets/index-C8u1oDXN.js');
  const W = window.__art, o = window.__jsx, RD = window.__rd;
  const KEYS = ['iron-rift','silver-rift','gold-rift','titanium-rift','fallen-pine','fallen-oak','fallen-black-walnut','fallen-shagbark','flax-bloom','woad-bloom','madder-bloom','weld-bloom','mandrake-bloom','wolfsbane-bloom','adderfern-bloom','iron-rock','pine-tree','flax-plant'];
  const SIZE = { rift: 6, fallen: 10, bloom: 2, rock: 1, tree: 2, plant: 1 };
  const grid = document.getElementById('grid'), out = {};
  for (const k of KEYS) {
    const comp = W[k]; if (!comp) { out[k] = 'missing'; continue; }
    const sz = SIZE[Object.keys(SIZE).find(s => k.includes(s))] || 2;
    const cell = document.createElement('div'); cell.className = 'cell'; cell.innerHTML = `<div>${k}</div><div class="host"></div>`; grid.append(cell);
    const host = cell.querySelector('.host');
    try {
      RD.flushSync ? 0 : 0;
      const root = RD.createRoot(host);
      root.render(o.jsx('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: `-2 -6 ${sz + 4} ${sz + 8}`, children: o.jsx(comp, { position: { x: 0, y: 0 }, centerX: sz / 2, centerY: sz / 2, width: sz, height: sz, resolvedLabel: undefined, flipX: false }) }));
      await new Promise(r => setTimeout(r, 60));
      const svg = host.querySelector('svg');
      if (svg) { const b = svg.getBBox(); const p = Math.max(b.width, b.height) * 0.06; svg.setAttribute('viewBox', `${b.x - p} ${b.y - p} ${b.width + 2 * p} ${b.height + 2 * p}`); out[k] = { w: +b.width.toFixed(2), h: +b.height.toFixed(2), len: svg.outerHTML.length }; }
      else out[k] = 'no svg';
    } catch (e) { out[k] = 'error ' + e.message; }
  }
  return out;
})();
</script></body></html>
